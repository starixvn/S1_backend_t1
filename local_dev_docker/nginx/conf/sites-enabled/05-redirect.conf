server {
    listen 80;
    listen 443 http2 ssl;
    server_name "~^(?<dname>[^.]+?\.[^.]+?)$" "~^(?<dname>[^.]+?\.t1t\.games)$";
    ssl_certificate ssl/og.cert;
    ssl_certificate_key ssl/og.key;
    rewrite ^ $scheme://www.$dname$request_uri redirect;
}
server {
    listen 80;
    listen 443 http2 ssl;
    server_name "~^(?<dname>staging\.[^.]+?\.[^.]+?)$" "~^(?<dname>staging\.[^.]+?\.[^.]+?\.[^.]+?)$";
    ssl_certificate ssl/og.cert;
    ssl_certificate_key ssl/og.key;
    rewrite ^ $scheme://www.$dname$request_uri redirect;
}
